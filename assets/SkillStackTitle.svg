<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070b"/>
      <stop offset="55%" stop-color="#0b1018"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1FB6A8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7CFFCB" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1FB6A8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1FB6A8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1FB6A8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbe9ec"/>
    </linearGradient>
    <path id="petal2" d="M0,6.75 C-4.12,3.75 -4.12,-1.12 -3.15,-4.65 L0,-2.71 L3.15,-4.65 C4.12,-1.12 4.12,3.75 0,6.75 Z"/>
    <filter id="glowText" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#3fe3c4" flood-opacity="0.6"/>
    </filter>
    <style>
      .edge-sway-a { animation: waveMove 10s ease-in-out infinite; }
      @keyframes waveMove {
        0%, 100% { transform: translateX(-10px); }
        50% { transform: translateX(10px); }
      }
      .edge-ripple { animation: edgeRipple 3.6s ease-in-out infinite; }
      @keyframes edgeRipple {
        0%, 100% { transform: translateX(-3px); }
        50% { transform: translateX(3px); }
      }
      .p-fall {
        animation-name: pfall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        animation-fill-mode: backwards;
      }
      @keyframes pfall {
        0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.8; }
        100% { transform: translateY(60px) rotate(220deg); opacity: 0; }
      }
      .title { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    </style>
  </defs>

  <rect width="1200" height="70" fill="url(#bgGrad)"/>

  <g>
    <g class="edge-sway-a">
      <g transform="translate(147,0) rotate(90) scale(0.05833,1)">
        <path d="M0,132 C300,120 900,144 1200,132 L1200,160 L0,160 Z" fill="url(#waveFillGrad)"/>
        <path d="M0,132 C300,120 900,144 1200,132" fill="none" stroke="url(#waveGrad)" stroke-width="1.5"/>
      </g>
      <g class="edge-ripple">
        <g transform="translate(147,0) rotate(90) scale(0.05833,1)">
          <path d="M0,138 C300,150 900,126 1200,142" fill="none" stroke="url(#waveGrad)" stroke-width="1" opacity="0.6"/>
        </g>
      </g>
    </g>

    <g transform="translate(1200,0) scale(-1,1)">
      <g class="edge-sway-a">
        <g transform="translate(147,0) rotate(90) scale(0.05833,1)">
          <path d="M0,132 C300,120 900,144 1200,132 L1200,160 L0,160 Z" fill="url(#waveFillGrad)"/>
          <path d="M0,132 C300,120 900,144 1200,132" fill="none" stroke="url(#waveGrad)" stroke-width="1.5"/>
        </g>
        <g class="edge-ripple">
          <g transform="translate(147,0) rotate(90) scale(0.05833,1)">
            <path d="M0,138 C300,150 900,126 1200,142" fill="none" stroke="url(#waveGrad)" stroke-width="1" opacity="0.6"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <text x="40" y="35" dominant-baseline="central" text-anchor="start" class="title" font-size="30" font-weight="600" letter-spacing="1.2" fill="#f4fbf9" filter="url(#glowText)">Skill Stack</text>

  <g fill="url(#petalGrad2)">
    <g transform="translate(300,10)">
      <use href="#petal2" class="p-fall" opacity="0.85" style="animation-duration:5s; animation-delay:0s"/>
    </g>
    <g transform="translate(560,10) scale(0.85)">
      <use href="#petal2" class="p-fall" opacity="0.8" style="animation-duration:6.2s; animation-delay:1.5s"/>
    </g>
    <g transform="translate(760,10) scale(1.1)">
      <use href="#petal2" class="p-fall" opacity="0.85" style="animation-duration:5.6s; animation-delay:3s"/>
    </g>
    <g transform="translate(900,10) scale(0.9)">
      <use href="#petal2" class="p-fall" opacity="0.8" style="animation-duration:4.6s; animation-delay:2.2s"/>
    </g>
    <g transform="translate(150,10) scale(0.95)">
      <use href="#petal2" class="p-fall" opacity="0.8" style="animation-duration:5.4s; animation-delay:0.8s"/>
    </g>
    <g transform="translate(430,10) scale(1.05)">
      <use href="#petal2" class="p-fall" opacity="0.85" style="animation-duration:6.0s; animation-delay:2.6s"/>
    </g>
    <g transform="translate(660,10) scale(0.8)">
      <use href="#petal2" class="p-fall" opacity="0.75" style="animation-duration:4.9s; animation-delay:3.8s"/>
    </g>
    <g transform="translate(1050,10) scale(1.1)">
      <use href="#petal2" class="p-fall" opacity="0.85" style="animation-duration:5.8s; animation-delay:1.2s"/>
    </g>
  </g>
</svg>
